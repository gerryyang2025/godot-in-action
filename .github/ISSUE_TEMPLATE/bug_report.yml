name: Bug report
description: Report a problem in this repository's original demo code or docs.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough context to reproduce it in Godot.
  - type: input
    id: target
    attributes:
      label: Target directory
      description: Which demo or document is affected?
      placeholder: demo_2d/
    validations:
      required: true
  - type: input
    id: godot_version
    attributes:
      label: Godot version
      placeholder: 4.6.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that reproduces the problem.
      placeholder: |
        1. Open the project with Godot 4.6.2
        2. Run the main scene
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant Godot debugger output or attach screenshots.
    validations:
      required: false
